<section id="evolution" class="section evolution" aria-labelledby="evolution-heading">
  <div class="container" *ngIf="portfolio">
    <div class="section-header reveal">
      <h2 id="evolution-heading" class="section-title">Portfolio Evolution</h2>
      <div class="title-line" aria-hidden="true"></div>
      <p class="section-subtitle">From engineering foundations to AI-native leadership. Six versions, one continuous story.</p>
    </div>
    <div class="evolution-grid">
      <div class="card card-hover reveal" *ngFor="let ver of portfolio.versions" [class.status-active]="ver.status === 'active'">
        <span class="evolution-status" [class.active]="ver.status === 'active'">{{ver.status === 'active' ? 'Current' : 'Planned'}}</span>
        <h3>{{ver.name}}</h3>
        <p class="evolution-period">{{ver.period}}</p>
        <p class="evolution-tech">{{ver.technology}}</p>
        <p class="evolution-desc">{{ver.description}}</p>
        <a *ngIf="ver.id === 'v1'" href="../v1-klu-foundation/index.html" class="evolution-link">Visit V1</a>
        <a *ngIf="ver.id === 'v2'" href="../v2-enterprise-java/" class="evolution-link">Visit V2</a>
        <a *ngIf="ver.id === 'v4'" href="../v4-react-design-system/" class="evolution-link">Preview V4</a>
      </div>
    </div>
  </div>
</section>
